name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build FOBO-Data-Maker.slnx -c Release
      - run: dotnet test DataMaker.Sdk.Net/DataMaker.Sdk.slnx -c Release

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DataMaker.Sdk.Js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DataMaker.Sdk.Py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[test]"
      - run: pytest -q
